# -----------------------------------------------------------------------------
# AINE — Redis configuration.
# Profile: development. Harden for production via env overlays.
# -----------------------------------------------------------------------------

bind 0.0.0.0 -::*
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 60

# Persistence — AOF for durability, RDB for snapshots.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000

# Memory policy. The broker should not evict — set a per-deployment maxmemory.
# maxmemory 1gb
# maxmemory-policy noeviction

# Slow log (microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 256

# Keyspace notifications: required for event-driven scheduler triggers.
notify-keyspace-events "Ex"

# Disable dangerous commands in shared environments.
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG ""
