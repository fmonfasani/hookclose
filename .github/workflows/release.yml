name: Release

# Cut a release by pushing a SemVer tag, e.g. `git tag v0.2.0 && git push --tags`.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create the GitHub release

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-and-release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install build + dev (gate)
        run: python -m pip install -e ".[dev]"

      # Re-assert the quality gate before releasing — releases are deterministic.
      - name: Quality gate
        run: |
          ruff check .
          ruff format --check .
          mypy runtime agents contracts events workflows memory sandbox observability scheduler tasks adapters providers workers orchestration
          pytest -m "not integration" -q

      - name: Build sdist + wheel
        run: python -m build

      - name: Check artifacts
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
