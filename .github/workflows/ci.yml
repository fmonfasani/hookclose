name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: mypy
        run: mypy runtime agents contracts events workflows memory sandbox observability scheduler tasks adapters providers workers orchestration

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: pytest -m "not integration" --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=70
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  smoke:
    name: Runtime smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: import surface
        run: python -c "import runtime, providers, workers, orchestration, events, tasks"
      - name: pytest smoke
        run: pytest -m smoke -q

  security:
    name: Security scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Dependency vulnerability scan. Non-blocking: new upstream advisories must
      # not break unrelated PRs; triage happens via the surfaced report.
      - name: pip-audit
        continue-on-error: true
        run: pip-audit --strict --progress-spinner=off
      # bandit-class checks (ruff "S") are already enforced in the lint job.

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Dockerfiles build (no push)
        run: |
          for df in docker/base docker/api docker/worker docker/sandbox; do
            if [ -f "$df/Dockerfile" ]; then
              echo "::group::build $df"
              docker build -f "$df/Dockerfile" -t "aine-${df##*/}:ci" . || exit 1
              echo "::endgroup::"
            fi
          done

  # Aggregate gate so branch protection can require a single status check.
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, smoke]
    if: always()
    steps:
      - name: Verify required jobs succeeded
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.smoke.result }}" != "success" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
