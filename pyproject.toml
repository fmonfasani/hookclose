[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aine-platform"
version = "0.1.0"
description = "AI-Native operational platform for autonomous software development. Deterministic-first, event-capable, multi-agent runtime."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Platform Engineering" }]

dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy[asyncio]>=2.0.29,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pgvector>=0.2.5,<1.0",
    "redis[hiredis]>=5.0,<6.0",
    "celery[redis]>=5.4,<6.0",
    "httpx>=0.27,<1.0",
    "tenacity>=8.2,<9.0",
    "structlog>=24.1,<25.0",
    "orjson>=3.10,<4.0",
    "python-ulid>=2.7,<3.0",
    "anyio>=4.3,<5.0",
    "opentelemetry-api>=1.24,<2.0",
    "opentelemetry-sdk>=1.24,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-instrumentation-redis>=0.45b0",
    "opentelemetry-instrumentation-celery>=0.45b0",
    "opentelemetry-exporter-otlp>=1.24,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-mock>=3.14,<4.0",
    "hypothesis>=6.100,<7.0",
    "pre-commit>=3.7,<4.0",
    "types-redis>=4.6,<5.0",
    "pip-audit>=2.7,<3.0",
    "build>=1.2,<2.0",
]

[project.scripts]
aine = "runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = [
    "runtime",
    "agents",
    "contracts",
    "events",
    "workflows",
    "memory",
    "sandbox",
    "observability",
    "scheduler",
    "tasks",
    "adapters",
    "providers",
    "workers",
    "orchestration",
]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Standalone container entrypoints (hyphenated, non-importable) are rebuilt as
# real workers in later phases; exclude until then. Keep importable packages linted.
extend-exclude = ["infra", "docker", "deploy", "specs", "reviews", "opencode-worker", "workflow-engine"]

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pycodestyle / pyflakes
    "I",                  # isort
    "B",                  # bugbear
    "UP",                 # pyupgrade
    "S",                  # bandit
    "C4",                 # comprehensions
    "SIM",                # simplify
    "TID",                # tidy imports (forbids relative imports beyond parent)
    "PL",                 # pylint
    "RUF",                # ruff
    "ANN",                # annotations (typed-first policy)
    "ASYNC",              # async best practices
]
ignore = [
    "ANN101", "ANN102",   # self/cls annotations
    "PLR0913",            # too many arguments — common in contracts
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "PLR2004", "RUF059", "B007", "ASYNC109"]
"scripts/**/*.py" = ["PLR2004", "S101"]
"**/__init__.py" = ["F401"]
# `timeout` is part of the CommandRunner contract (passed to asyncio.wait_for).
"workers/contracts.py" = ["ASYNC109"]
"workers/openclaw.py" = ["ASYNC109"]
# Local-fallback runner does fast local fs/path ops; acceptable off the hot path.
"workers/runners.py" = ["ASYNC109", "ASYNC230", "ASYNC240"]
# Interface boundaries where dynamically typed payloads are intentional:
# structured logger fields, telemetry values, outbound JSON bodies.
"observability/logging.py" = ["ANN401"]
"adapters/telemetry/**/*.py" = ["ANN401"]
"adapters/http/base.py" = ["ANN401"]
"contracts/telemetry.py" = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = [
    "runtime", "agents", "contracts", "events", "workflows",
    "memory", "sandbox", "observability", "scheduler", "tasks", "adapters", "providers",
    "workers", "orchestration",
]
force-sort-within-sections = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# -----------------------------------------------------------------------------
# mypy — strict typing baseline
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]
exclude = ["^infra/", "^docker/", "^specs/", "^reviews/"]

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# -----------------------------------------------------------------------------
# Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "-p no:cacheprovider",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests (no I/O, no containers)",
    "integration: requires postgres/redis",
    "contract: contract-level tests against Protocol surface",
    "smoke: in-process end-to-end wiring checks (CI smoke gate)",
    "slow: long-running tests",
]

[tool.coverage.run]
branch = true
source = [
    "runtime", "agents", "contracts", "events", "workflows",
    "memory", "sandbox", "observability", "scheduler", "tasks", "adapters", "providers",
    "workers", "orchestration",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
