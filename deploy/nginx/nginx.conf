# Reverse proxy + TLS termination for the HookClose runtime API.
# The runtime API (workflow-engine) listens on 8101 inside the compose network;
# nginx is the only service exposed to the internet.
worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    server_tokens off;
    log_format main '$remote_addr - $status "$request" $body_bytes_sent "$http_user_agent"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    upstream runtime_api {
        server workflow-engine:8101;
    }

    # Liveness for nginx itself (used by the container healthcheck).
    server {
        listen 80;
        location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
        # Redirect everything else to HTTPS.
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 10m;

        location / {
            proxy_pass http://runtime_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
